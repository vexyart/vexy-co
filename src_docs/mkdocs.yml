# this_file: src_docs/mkdocs.yml
site_name: LLM tools
site_description: "Tools around Large Language Model: the umbrella for the Vexy LLM tools"
site_url: https://vexy.dev/vexy-co/
repo_url: https://github.com/vexyart/vexy-co
repo_name: GitHub
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: fly-january-remote
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}
extra:
  fly:
    chrome: none
    hue: indigo
    links: accent
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - fly
  - search
nav:
  - Home: index.md
  - Related projects: related-projects.md
  - Repository contents: repository.md
  - Licence: license.md
  - Documentation build: documentation.md
  - Contributing: contributing.md
  - Changelog: changelog.md
